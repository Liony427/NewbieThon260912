<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="page1G.css">
  <link rel="stylesheet" href="page1S.css">
  <link rel="stylesheet" href="page1.css">

  <script
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=af218617e0c33cd4ec2576f87ba3288f&libraries=services">
  </script>
</head>

<body>

<div class="element">

  <img class="logo" src="img/logo.png" />

  <!-- 기존 회색 지도 영역 -->
  <div class="rectangle" id="map"></div>

  <div class="div"></div>

  <div class="text-wrapper">
    예약 내용 확인
  </div>

  <img class="line" src="img/line-2.svg" />


  <div class="group">

    <div class="group-2">

      <!-- 위치 -->
      <div class="group-3">

        <div class="rectangle-2"></div>

        <div class="text-wrapper-2">
          위치
        </div>

        <div
          id="selectedAddress"
          style="
            position: absolute;
            left: 90px;
            top: 18px;
            font-size: 14px;
            max-width: 210px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
          "
        >
          지도에서 위치를 선택해주세요
        </div>

        <div class="group-4">
          <img class="vector" src="img/vector.svg" />
          <img class="img" src="img/vector-2.svg" />
        </div>

      </div>


      <!-- 반경 -->
      <div class="group-5">

        <div class="rectangle-2"></div>

        <div class="text-wrapper-2">
          반경
        </div>

        <img
          class="vector-2"
          src="img/vector-3.svg"
        />

        <div class="frame">

          <div
            class="group-6 radius-option"
            data-radius="100"
          >
            <div class="rectangle-3"></div>
            <div class="text-wrapper-3">
              100m
            </div>
          </div>

          <div
            class="group-6 radius-option selected-option"
            data-radius="300"
          >
            <div class="rectangle-4"></div>
            <div class="text-wrapper-4">
              300m
            </div>
          </div>

          <div
            class="group-7 radius-option"
            data-radius="500"
          >
            <div class="rectangle-3"></div>
            <div class="text-wrapper-3">
              500m
            </div>
          </div>

        </div>

      </div>


      <!-- 유지 시간 -->
      <div class="rectangle-5"></div>

      <div class="text-wrapper-5">
        유지 시간
      </div>

      <div class="vector-wrapper">
        <img
          class="vector-3"
          src="img/image.svg"
        />
      </div>

    </div>

  </div>


  <!-- 유지 시간 선택 -->
  <div class="frame-2">

    <div
      class="group-6 duration-option"
      data-duration="15"
    >
      <div class="rectangle-3"></div>
      <div class="text-wrapper-7">
        15분
      </div>
    </div>

    <div
      class="group-6 duration-option selected-option"
      data-duration="30"
    >
      <div class="rectangle-4"></div>
      <div class="text-wrapper-6">
        30분
      </div>
    </div>

    <div
      class="group-7 duration-option"
      data-duration="60"
    >
      <div class="rectangle-3"></div>
      <div class="text-wrapper-8">
        1시간
      </div>
    </div>

  </div>


  <p class="p">
    <span class="span">|&nbsp;&nbsp;</span>
    <span class="text-wrapper-9">
      예약하기
    </span>
  </p>


  <div
    class="div-wrapper"
    id="nextButton"
  >
    <div class="text-wrapper-10">
      다음
    </div>
  </div>


  <p class="text-wrapper-11">
    예약 정보를 다시 한 번 확인해주세요.
  </p>

</div>


<script src="page1.js"></script>

</body>
</html>
