<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>반납 경로 | 바톤터치</title>

    <link rel="stylesheet" href="return_flow.css">
    <script src="return_flow.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header>
        <a class="brand" href="main.html" aria-label="바톤터치 홈">
          <img
            src="img/logo.png"
            alt="바톤터치"
            width="70"
            height="70"
          >
        </a>

        <span class="divider" aria-hidden="true">|</span>
        <h1>반납 경로</h1>
      </header>

      <main class="screen complete-screen">
        <div
          class="map"
          role="img"
          aria-label="반납 위치 지도 표시 영역"
        >
          <svg
            class="icon map-pin"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M16 2C9 2 4 7 4 14c0 9 12 17 12 17s12-8 12-17C28 7 23 2 16 2Z"
              fill="currentColor"
              stroke="white"
            />
            <circle
              cx="16"
              cy="13"
              r="5"
              fill="#d9d9d9"
              stroke="white"
            />
          </svg>
        </div>

        <section class="sheet completion">
          <span class="badge large">
            <svg
              class="icon"
              viewBox="0 0 32 32"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m7 16 6 6L25 8" stroke-width="5" />
            </svg>
          </span>

          <h2>
            반경 안에 들어왔어요
            <strong>자전거 락 완료</strong>
          </h2>

          <p class="subtitle">
            바톤 할인이 적용되었습니다!
          </p>

          <div class="discount">
            <strong>바톤 할인</strong>
            <strong>2,800원</strong>
          </div>

          <a class="primary" href="main.html">
            완료
          </a>
        </section>
      </main>
    </div>
  </body>
</html>
