<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>바톤터치 - 예약하기</title>

  <link rel="stylesheet" href="reservation_flow.css">

  <!-- 카카오 지도 -->
  <script
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=af218617e0c33cd4ec2576f87ba3288f&libraries=services"
  ></script>
</head>


<body data-page="confirm">

<main class="app reservation-confirm-page">

  <!-- 상단 -->
  <header>

    <a class="brand" href="main.html" aria-label="메인 화면으로 이동">
  <img
    src="img/logo.png"
    alt="바톤터치"
  >
</a>

    <span class="divider">|</span>

    <h1>예약하기</h1>

  </header>


  <!-- 지도 -->
  <section
    id="reservation-map"
    class="reservation-map"
    aria-label="예약 위치 선택 지도"
  ></section>


  <!-- 예약 설정 -->
  <section class="reservation-sheet">

    <div class="handle"></div>

    <h2>예약 내용 확인</h2>

    <p class="reservation-guide">
      예약 정보를 선택해주세요.
    </p>


    <!-- 선택 위치 -->
    <div class="reservation-option-row">

      <span class="option-label">
        위치
      </span>

      <span
        id="selected-address"
        class="option-value address"
      >
        지도에서 위치를 선택해주세요
      </span>

    </div>


    <!-- 반경 -->
    <div class="reservation-option-row">

      <span class="option-label">
        반경
      </span>

      <div
        class="option-buttons"
        id="radius-options"
      >

        <button
          type="button"
          class="option-button"
          data-radius="100"
        >
          100m
        </button>

        <button
          type="button"
          class="option-button selected"
          data-radius="300"
        >
          300m
        </button>

        <button
          type="button"
          class="option-button"
          data-radius="500"
        >
          500m
        </button>

      </div>

    </div>


    <!-- 유지시간 -->
    <div class="reservation-option-row">

      <span class="option-label">
        유지 시간
      </span>

      <div
        class="option-buttons"
        id="duration-options"
      >

        <button
          type="button"
          class="option-button selected"
          data-duration="15"
        >
          15분
        </button>

        <button
          type="button"
          class="option-button"
          data-duration="30"
        >
          30분
        </button>

        <button
          type="button"
          class="option-button"
          data-duration="60"
        >
          1시간
        </button>

      </div>

    </div>


    <!-- 다음 -->
    <button
      type="button"
      class="reservation-next-button"
      id="reservation-next"
    >
      다음
    </button>

  </section>

</main>


<script src="reservation_map.js"></script>

</body>
</html>
