<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>
      예약 내용 확인 | 바톤터치
    </title>
    <link rel="stylesheet" href="reservation_flow.css">
    <script src="reservation_flow.js" defer>
    </script>
  </head>
  <body data-page="confirm">
    <div class="app">
      <header class="header">
        <a class="brand" href="main.html" aria-label="바톤터치 홈">
          <img src="img/logo.png" width="70" height="70" alt="바톤터치">
        </a>
        <span class="divider" aria-hidden="true">
          |
        </span>
        <h1>
          예약하기
        </h1>
      </header>
      <main class="screen">
        <div class="map" role="img" aria-label="지도 표시 영역">
        </div>
        <section class="sheet">
          <div class="handle" aria-hidden="true">
          </div>
          <h2>
            예약 내용 확인
          </h2>
          <p class="subtitle">
            예약 정보를 다시 한 번 확인해주세요.
          </p>
          <form id="reservation-form">
            <label class="setting location">
              <svg class="icon icon-pin" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 30S5 21 5 13a11 11 0 0 1 22 0c0 8-11 17-11 17Z"/>
                <circle cx="16" cy="13" r="4"/>
              </svg>
              <span class="sr-only">
                예약 위치
              </span>
              <input name="location" aria-label="예약 위치" placeholder="위치" maxlength="100">
            </label>
            <fieldset class="setting">
              <legend class="sr-only">
                예약 반경
              </legend>
              <span class="setting-label" aria-hidden="true">
                <svg class="icon icon-radius" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="16" cy="16" r="13" stroke-dasharray="6 4"/>
                </svg>
                반경
              </span>
              <div class="options">
                <label>
                  <input type="radio" name="radius" value="100" >
                  <span>
                    100m
                  </span>
                </label>
                <label>
                  <input type="radio" name="radius" value="300" checked>
                  <span>
                    300m
                  </span>
                </label>
                <label>
                  <input type="radio" name="radius" value="500" >
                  <span>
                    500m
                  </span>
                </label>
              </div>
            </fieldset>
            <fieldset class="setting">
              <legend class="sr-only">
                유지 시간
              </legend>
              <span class="setting-label" aria-hidden="true">
                <svg class="icon icon-clock" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="16" cy="16" r="13"/>
                  <path d="M16 6v11l6 5"/>
                </svg>
                유지 시간
              </span>
              <div class="options">
                <label>
                  <input type="radio" name="duration" value="15" checked>
                  <span>
                    15분
                  </span>
                </label>
                <label>
                  <input type="radio" name="duration" value="30" >
                  <span>
                    30분
                  </span>
                </label>
                <label>
                  <input type="radio" name="duration" value="60" >
                  <span>
                    1시간
                  </span>
                </label>
              </div>
            </fieldset>
            <button class="primary next" type="submit">
              다음
            </button>
          </form>
        </section>
      </main>
    </div>
    <p class="toast" id="status" role="status" hidden>
    </p>
  </body>
</html>
