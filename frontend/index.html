<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="styleguide.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="element">

  <div class="rectangle"></div>

  <div class="group">

    <div class="div">

      <img
        class="logo"
        src="img/logo.png"
        alt="자전거 바톤터치 로고"
      />

      <p class="p">
        <span class="text-wrapper">원하는 곳 가까이,</span>
        <span class="span">&nbsp;</span>
        <span class="text-wrapper-2">자전거를 이어받다</span>
      </p>

      <button
        class="text-wrapper-3"
        id="signupButton"
        type="button"
      >
        회원가입
      </button>

      <button
        class="text-wrapper-4"
        id="findPasswordButton"
        type="button"
      >
        비밀번호 찾기
      </button>

    </div>


    <input
      class="rectangle-2"
      id="emailInput"
      type="email"
      placeholder="이메일"
      autocomplete="email"
    />


    <input
      class="rectangle-3"
      id="passwordInput"
      type="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    />


    <button
      class="rectangle-4"
      id="loginButton"
      type="button"
      aria-label="로그인"
    ></button>


    <img
      class="line"
      src="img/line-1.png"
      alt=""
    />

    <div
      class="text-wrapper-5"
      id="loginButtonText"
    >
      로그인
    </div>


    <div class="carbon-email">
      <img
        class="img"
        src="img/email.png"
        alt=""
      />
    </div>

    <div class="at-icons-lock">
      <img
        class="img"
        src="img/lock.png"
        alt=""
      />
    </div>

  </div>

</div>

<script src="login.js"></script>

</body>
</html>
