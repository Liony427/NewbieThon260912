
    <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta charset="utf-8" />
<link rel="stylesheet" href="globals.css">

/>

  class="rectangle-3"

  type="password"

/>

  class="rectangle-4"
  id="loginButton"
  type="button"
></button>

<img class="line" src="img/line-1.png" />
