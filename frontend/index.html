<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>자전거 바톤터치</title>

  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="styleguide.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="element">

    <!-- 로고 영역 -->
    <section class="logo-section">

      <img
        class="logo"
        src="img/logo.png"
        alt="자전거 바톤터치"
      >

      <p class="tagline">
        <span>원하는 곳 가까이,</span>
        <span class="green">자전거를 이어받다</span>
      </p>

    </section>


    <!-- 로그인 영역 -->
    <section class="login-card">

      <!-- 이메일 -->
      <div class="input-wrapper">

        <img
          class="input-icon"
          src="img/email.png"
          alt=""
        >

        <input
          id="emailInput"
          class="login-input"
          type="email"
          placeholder="이메일"
          autocomplete="email"
        >

      </div>


      <!-- 비밀번호 -->
      <div class="input-wrapper">

        <img
          class="input-icon"
          src="img/lock.png"
          alt=""
        >

        <input
          id="passwordInput"
          class="login-input"
          type="password"
          placeholder="비밀번호"
          autocomplete="current-password"
        >

      </div>


      <!-- 로그인 버튼 -->
      <button
        id="loginButton"
        class="login-button"
        type="button"
      >
        로그인
      </button>


      <!-- 하단 버튼 -->
      <div class="login-links">

        <button
          class="link-button"
          type="button"
        >
          회원가입
        </button>

        <div class="divider"></div>

        <button
          class="link-button"
          type="button"
        >
          비밀번호 찾기
        </button>

      </div>

    </section>

  </main>


  <script src="login.js"></script>

</body>
</html>
