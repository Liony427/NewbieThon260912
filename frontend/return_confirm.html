<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>반납하기 | 바톤터치</title>

    <link rel="stylesheet" href="return_flow.css">
    <script src="return_flow.js" defer></script>
  </head>

  <body data-page="confirm">
    <div class="app">
      <header>
        <a class="brand" href="main.html" aria-label="바톤터치 홈">
          <img
            src="img/logo.png"
            alt="바톤터치"
            width="70"
            height="70"
          >
        </a>

        <span class="divider" aria-hidden="true">|</span>
        <h1>반납하기</h1>
      </header>

      <main class="confirm-screen">
        <section
          class="confirmation"
          aria-labelledby="confirm-title"
        >
          <span class="badge large">
            <svg
              class="icon"
              viewBox="0 0 32 32"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m7 16 6 6L25 8" stroke-width="5" />
            </svg>
          </span>

          <h2 id="confirm-title">이 요청으로 반납할까요?</h2>
          <p class="subtitle">
            아래 정보를 확인하고 진행해주세요.
          </p>

          <dl class="details">
            <div>
              <dt>
                <svg
                  class="icon"
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 4h10l15 15-10 10L4 14Z" />
                  <circle cx="10" cy="10" r="2" />
                </svg>

                추가 할인
              </dt>

              <dd data-value="reward"></dd>
            </div>

            <div>
              <dt>
                <svg
                  class="icon"
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle
                    cx="16"
                    cy="16"
                    r="13"
                    stroke-dasharray="6 4"
                  />
                </svg>

                반경
              </dt>

              <dd data-value="radius"></dd>
            </div>

            <div>
              <dt>
                <svg
                  class="icon"
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="16" cy="16" r="13" />
                  <path d="M16 7v10l6 6" />
                </svg>

                예상 추가 시간
              </dt>

              <dd data-value="time"></dd>
            </div>
          </dl>

          <div class="actions">
            <a class="secondary" href="return_recommend.html">
              취소
            </a>

            <button
  class="primary"
  id="confirm-link"
  type="button"
>
  확인
</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
