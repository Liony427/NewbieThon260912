<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>
    반납하기 | 바톤터치
  </title>

  <link
    rel="stylesheet"
    href="return_flow.css"
  >

  <!-- 카카오 지도 -->
  <script
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=af218617e0c33cd4ec2576f87ba3288f&libraries=services"
  ></script>

  <script
    src="return_flow.js"
    defer
  ></script>
</head>


<body data-page="recommend">

<div class="app">

  <header>

    <a
      class="brand"
      href="main.html"
      aria-label="바톤터치 홈"
    >
      <img
        src="img/logo.png"
        alt="바톤터치"
        width="70"
        height="70"
      >
    </a>

    <span
      class="divider"
      aria-hidden="true"
    >
      |
    </span>

    <h1>
      반납하기
    </h1>

  </header>


  <main
    class="screen recommend-screen"
  >

    <!-- 실제 지도 -->
    <div
      class="map"
      id="return-map"
      aria-label="현재 위치와 추천 반납 위치 지도"
    ></div>


    <section
      class="sheet recommendations"
    >

      <div
        class="handle"
        aria-hidden="true"
      ></div>


      <h2>
        추천 요청
      </h2>

      <p
        class="subtitle"
        id="recommend-status"
      >
        현재 위치를 확인하고 있어요.
      </p>


      <!-- JS가 실제 예약을 여기에 생성 -->
      <div
        class="choices"
        id="recommendation-list"
      >
      </div>


      <button
        class="primary"
        id="refresh-recommendations"
        type="button"
      >
        주변 요청 다시 찾기
      </button>

    </section>

  </main>

</div>

</body>

</html>
