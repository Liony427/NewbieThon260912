<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>바톤터치</title>

    <link rel="stylesheet" href="return_flow.css">
    <script src="main.js" defer></script>

    <style>
      @font-face {
        font-family: "LogoutFreesentation5";
        src: url("./fonts/Freesentation-5Medium.ttf") format("truetype");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      .home #logoutButton {
        appearance: none;
        -webkit-appearance: none;
        box-sizing: border-box;

        display: flex;
        align-items: center;
        justify-content: center;
        align-self: center;
        flex: 0 0 auto;

        width: 118px;
        max-width: 100%;
        min-height: 50px;
        margin: 54px auto 0;
        padding: 10px 16px;

        border: 1px solid #c5ccca;
        border-radius: 16px;
        background: #fcfdfc;
        box-shadow: none;
        color: #000;

        font-family: "LogoutFreesentation5", sans-serif;
        font-size: 20px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: normal;
        text-align: center;

        cursor: pointer;
      }

      .home #logoutButton:hover {
        background: #f0f7f4;
      }

      .home #logoutButton:active {
        background: #e5f0eb;
      }

      .home #logoutButton:focus-visible {
        outline: 2px solid #087b58;
        outline-offset: 4px;
      }
    </style>
  </head>

  <body>
    <main class="app home">
      <section class="home-brand" aria-label="바톤터치">
        <img
          class="home-logo"
          src="img/logo.png"
          alt="바톤터치"
        >

        <p class="home-description">
          원하는 곳 가까이,
          <strong>자전거를 이어받다</strong>
        </p>
      </section>

      <nav class="home-actions" aria-label="서비스 선택">
        <a
          class="home-button"
          href="reservation_confirm.html"
        >
          예약하기
        </a>

        <a
          class="home-button"
          href="return_recommend.html"
        >
          반납하기
        </a>
      </nav>

      <button
        class="home-logout"
        id="logoutButton"
        type="button"
      >
        로그아웃
      </button>
    </main>
  </body>
</html>
