<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>자전거 바톤터치</title>

  <link rel="stylesheet" href="mainG.css">
  <link rel="stylesheet" href="mainS.css">
  <link rel="stylesheet" href="main.css">

</head>


<body>

  <main class="element-main">


    <!-- 로고 -->
    <section class="main-logo-section">

      <img
        class="logo"
        src="img/logo.png"
        alt="자전거 바톤터치"
      >

      <p class="tagline">

        <span>
          원하는 곳 가까이,
        </span>

        <span class="green">
          자전거를 이어받다
        </span>

      </p>

    </section>


    <!-- 메뉴 -->
    <section class="main-menu">

      <button
        id="reserveButton"
        class="main-button"
        type="button"
      >
        예약하기
      </button>


      <button
        id="returnButton"
        class="main-button"
        type="button"
      >
        반납하기
      </button>

    </section>


  </main>


</body>

</html>
