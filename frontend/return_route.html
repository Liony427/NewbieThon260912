<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>반납 경로 | 바톤터치</title>

    <link rel="stylesheet" href="return_flow.css">
    <script src="return_flow.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header>
        <a class="brand" href="main.html" aria-label="바톤터치 홈">
          <img
            src="img/logo.png"
            alt="바톤터치"
            width="70"
            height="70"
          >
        </a>

        <span class="divider" aria-hidden="true">|</span>
        <h1>반납 경로</h1>
      </header>

      <main class="screen route-screen">
        <div
          class="map"
          role="img"
          aria-label="반납 경로 지도 표시 영역"
        ></div>

        <section
          class="sheet route-sheet"
          aria-label="반납 경로 안내"
        >
          <div class="handle" aria-hidden="true"></div>

          <div class="route-stats">
            <div>
              <span class="badge">
                <svg
                  class="icon"
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle
                    cx="16"
                    cy="16"
                    r="13"
                    stroke-dasharray="6 4"
                  />
                </svg>
              </span>

              <p>
                반경까지
                <strong>350m</strong>
              </p>
            </div>

            <div>
              <span class="badge">
                <svg
                  class="icon"
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="16" cy="16" r="13" />
                  <path d="M16 7v10l6 6" />
                </svg>
              </span>

              <p>
                예상 시간
                <strong>1분</strong>
              </p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
