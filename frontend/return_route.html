<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>반납 경로 | 바톤터치</title>

    <link rel="stylesheet" href="return_flow.css">
    <script src="return_flow.js" defer></script>
  </head>

  <body data-page="route">
    <div class="app">
      <header class="header">
        <a
          class="brand"
          href="main.html"
          aria-label="바톤터치 홈"
        >
          <img src="img/logo.png" alt="바톤터치">
        </a>

        <span class="header-divider" aria-hidden="true">|</span>

        <h1>반납 경로</h1>
      </header>

      <main class="screen">
        <div
          class="map"
          role="img"
          aria-label="반납 경로 지도 표시 예정 영역"
        ></div>

        <section class="sheet route-sheet">
          <div class="handle" aria-hidden="true"></div>

          <div class="route-stats">
            <div class="route-stat">
              <span class="badge">
                <span
                  class="radius-icon"
                  aria-hidden="true"
                ></span>
              </span>

              <p>
                반경까지
                <strong>350m</strong>
              </p>
            </div>

            <div class="route-stat">
              <span class="badge">
                <svg
                  class="stat-icon"
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <circle cx="16" cy="16" r="13" />
                  <path d="M16 7V17L22 23" />
                </svg>
              </span>

              <p>
                예상 시간
                <strong>1분</strong>
              </p>
            </div>
          </div>

          <!--
            실제 반납 완료 API가 연결되면 이 미리보기 링크를 제거합니다.
          -->
          <a
            class="preview-link"
            id="complete-preview-link"
            href="return_complete.html"
          >
            완료 화면 미리보기
          </a>
        </section>
      </main>
    </div>
  </body>
</html>
