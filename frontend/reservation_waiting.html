<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>매칭 대기중 | 바톤터치</title>

  <link
    rel="stylesheet"
    href="reservation_flow.css"
  >

  <script
    src="reservation_flow.js"
    defer
  ></script>
</head>


<body data-page="waiting">

  <div class="app">

    <header class="header">

      <a
        class="brand"
        href="main.html"
        aria-label="바톤터치 홈"
      >
        <img
          src="img/logo.png"
          width="70"
          height="70"
          alt="바톤터치"
        >
      </a>

    </header>


    <main class="overlay-screen">

      <section
        class="modal waiting"
        id="reservation-status-panel"
        aria-labelledby="waiting-title"
      >

        <span class="badge">

          <svg
            class="icon icon-spinner"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M16 2v5m0 18v5M2 16h5m18 0h5M6 6l4 4m12 12 4 4M6 26l4-4M22 10l4-4"
            />
          </svg>

        </span>


        <h2 id="waiting-title">
          매칭 대기중
        </h2>


        <p class="subtitle">
          조금만 기다려주세요.
        </p>


        <div class="waiting-stats">

          <div>

            <span class="badge">

              <svg
                class="icon icon-radius"
                viewBox="0 0 32 32"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle
                  cx="16"
                  cy="16"
                  r="13"
                  stroke-dasharray="6 4"
                />
              </svg>

            </span>

            <p>
              예약 반경

              <strong data-field="radius">
                확인 중...
              </strong>
            </p>

          </div>


          <div>

            <span class="badge">

              <svg
                class="icon icon-clock"
                viewBox="0 0 32 32"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle
                  cx="16"
                  cy="16"
                  r="13"
                />

                <path
                  d="M16 6v11l6 5"
                />
              </svg>

            </span>

            <p>
              예약 시간

              <strong id="reservation-time">
                확인 중...
              </strong>
            </p>

          </div>

        </div>


        <div class="actions">

          <a
            class="secondary"
            id="cancel-link"
            href="reservation_confirm.html"
          >
            예약 취소
          </a>


          <button
            class="primary"
            id="continue-waiting"
            type="button"
          >
            대기 계속
          </button>

        </div>

      </section>

    </main>

  </div>


  <p
    class="toast"
    id="status"
    role="status"
    hidden
  ></p>

</body>

</html>
