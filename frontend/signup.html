<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 바톤터치</title>
  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="styleguide.css">
  <link rel="stylesheet" href="signup.css">
  <script src="signup.js" defer></script>
</head>
<body>
  <main class="signup-page">
    <header class="brand">
      <img class="logo" src="img/logo.png" alt="바톤터치">
      <p>원하는 곳 가까이, <strong>자전거를 이어받다</strong></p>
    </header>
    <section class="signup-card" aria-labelledby="signup-title">
      <h1 id="signup-title">회원가입</h1>
      <form id="signupForm">
        <label class="field">
          <span class="sr-only">이메일</span>
          <img src="img/email.png" alt="">
          <input id="email" name="email" type="email" autocomplete="email" placeholder="이메일" maxlength="254" required>
        </label>
        <label class="field">
          <span class="sr-only">비밀번호 (8~16자)</span>
          <img src="img/lock.png" alt="">
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="비밀번호" minlength="8" maxlength="128" aria-describedby="passwordHint" required>
        </label>
        <label class="field">
          <span class="sr-only">비밀번호 확인</span>
          <img src="img/lock.png" alt="">
          <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호 확인" minlength="8" maxlength="128" required>
        </label>
        <p id="passwordHint" class="hint">비밀번호는 8~128자로 입력해주세요.</p>
        <p id="signupError" class="error" role="alert" hidden></p>
        <button id="signupButton" type="submit">회원가입</button>
      </form>
      <div id="signupSuccess" role="status" hidden>
        <p>회원가입이 완료되었습니다.<br>가입한 이메일로 로그인해주세요.</p>
        <a class="login-button" href="index.html">로그인 페이지로 이동</a>
      </div>
    </section>
    <p class="login-link">이미 계정이 있으신가요? <a href="index.html">로그인</a></p>
  </main>
</body>
</html>
