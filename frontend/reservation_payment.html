<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>
      예약 결제 | 바톤터치
    </title>
    <link rel="stylesheet" href="reservation_flow.css">
    <script src="reservation_flow.js" defer>
    </script>
  </head>
  <body data-page="payment">
    <div class="app">
      <header class="header">
        <a class="brand" href="main.html" aria-label="바톤터치 홈">
          <img src="img/logo.png" width="70" height="70" alt="바톤터치">
        </a>
        <span class="divider" aria-hidden="true">
          |
        </span>
        <h1>
          예약하기
        </h1>
      </header>
      <main class="payment">
        <a class="back" id="back-link" href="reservation_confirm.html">
          ← 돌아가기
        </a>
        <section class="payment-content">
          <dl class="summary panel">
            <div>
              <dt>
                <svg class="icon icon-pin" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M16 30S5 21 5 13a11 11 0 0 1 22 0c0 8-11 17-11 17Z"/>
                  <circle cx="16" cy="13" r="4"/>
                </svg>
                위치
              </dt>
              <dd data-field="location">
                성북구 어쩌고 저쩌고
              </dd>
            </div>
            <div>
              <dt>
                <svg class="icon icon-radius" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="16" cy="16" r="13" stroke-dasharray="6 4"/>
                </svg>
                반경
              </dt>
              <dd data-field="radius">
                300m
              </dd>
            </div>
            <div>
              <dt>
                <svg class="icon icon-clock" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="16" cy="16" r="13"/>
                  <path d="M16 6v11l6 5"/>
                </svg>
                유지 시간
              </dt>
              <dd data-field="duration">
                30분
              </dd>
            </div>
          </dl>
          <section class="panel method">
            <div class="panel-title">
              <h2>
                결제 수단
              </h2>
              <button class="text-button" id="other-payment" type="button">
                다른 결제 수단
              </button>
            </div>
            <div class="payment-method">
              <svg class="icon icon-card" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="5" width="28" height="22" rx="2"/>
                <path d="M2 11h28M7 21h2"/>
              </svg>
              Kakao Pay
            </div>
          </section>
          <form id="payment-form">
            <section class="panel total">
              <div class="panel-title">
                <h2>
                  총 결제 금액
                </h2>
                <strong class="price" id="reservation-price">
                  계산 중...
                </strong>
              </div>
              <div class="consents">
                <label class="consent">
                  <input type="checkbox" name="consent" required>
                  <span>
                    [필수] 서비스 이용약관에 동의합니다.
                  </span>
                </label>
                <label class="consent">
                  <input type="checkbox" name="consent" required>
                  <span>
                    [필수] 개인정보 수집 및 이용에 동의합니다.
                  </span>
                </label>
                <label class="consent">
                  <input type="checkbox" name="consent" required>
                  <span>
                    [필수] 위치기반서비스 이용약관에 동의합니다.
                  </span>
                </label>
                <label class="consent">
                  <input type="checkbox" name="consent" required>
                  <span>
                    [필수] 결제 및 환불 정책에 동의합니다.
                  </span>
                </label>
              </div>
            </section>
            <button class="primary pay" type="submit">
              결제하기
            </button>
          </form>
        </section>
        </main>
    </div>
    <p class="toast" id="status" role="status" hidden>
    </p>
  </body>
</html>
